[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-architecture-auth-service"
version = "0.1.0"
description = "Authentication and authorization service"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "argon2-cffi>=25.1,<26",
]

[tool.setuptools.packages.find]
where = ["src"]
